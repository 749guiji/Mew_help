<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识库录入</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kb.css">
</head>
<body class="kb-body" data-page="kb">
  <main class="kb-card">
    <header class="chat-header">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></span>
      <div class="header-text">
        <h1>知识库录入</h1>
        <p class="status">知识库内容管理</p>
      </div>
    </header>
    <div class="kb-main">
      <section class="kb-section">
        <h2>库存闸条</h2>
        <div id="overview" class="kb-overview">加载中…</div>
      </section>

      <section class="kb-section">
        <h2>建库材料</h2>
        <div class="kb-actions">
          <button id="preview-btn" type="button">切块预览（kb-preview）</button>
          <button id="build-btn" type="button">建库（kb-build）</button>
        </div>
        <div id="materials" class="kb-materials">加载中…</div>
        <div id="preview" class="kb-preview"></div>
        <div id="material-job-log" class="kb-log" hidden></div>
      </section>

      <section class="kb-section">
        <h2>手工录入</h2>
        <form id="entry-form" class="kb-form">
          <label>类型
            <select name="content_type">
              <option value="faq">faq</option>
              <option value="policy">policy</option>
              <option value="manual">manual</option>
            </select>
          </label>
          <label>分类
            <input name="category" placeholder="如：售后">
          </label>
          <label>问法
            <textarea name="questions" rows="2" placeholder="用户可能的问法，多个换行分隔"></textarea>
          </label>
          <label>答案
            <textarea name="answer" rows="3" placeholder="答案正文"></textarea>
          </label>
          <button type="submit">录入（落 pending）</button>
        </form>
        <div id="entry-result" class="kb-result"></div>
      </section>

      <section class="kb-section">
        <h2>对话挖知识</h2>
        <div class="kb-actions">
          <button id="mine-btn" type="button">挖知识（kb-mine）</button>
        </div>
        <div id="staging" class="kb-overview">暂存三态加载中…</div>
        <div id="mine-job-log" class="kb-log" hidden></div>
      </section>

      <section class="kb-section">
        <h2>向量化与双写</h2>
        <div class="kb-actions">
          <button id="vectorize-btn" type="button">补 pending（kb-vectorize）</button>
          <button id="reset-btn" type="button">清库重建（kb-reset）</button>
        </div>
        <div id="vectorize-result" class="kb-result"></div>
        <div id="vectorize-job-log" class="kb-log" hidden></div>
      </section>

      <section class="kb-section">
        <h2>检索自测</h2>
        <div class="kb-search">
          <select id="search-strategy" title="检索路线">
            <option value="hybrid_rerank">hybrid_rerank</option>
            <option value="dense">dense</option>
            <option value="sparse">sparse</option>
            <option value="hybrid">hybrid</option>
          </select>
          <input id="search-input" placeholder="输入问题，如：退货政策是什么？">
          <button id="search-btn" type="button">检索</button>
        </div>
        <div id="search-result" class="kb-result"></div>
      </section>

      <section class="kb-section">
        <h2>最近入库</h2>
        <div id="recent" class="kb-result">加载中…</div>
      </section>
    </div>
  </main>

  <script src="/admin-shell.js" defer></script>
  <script src="/kb.js" defer></script>
</body>
</html>
