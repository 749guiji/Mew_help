<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线客服</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <button id="new-chat" class="new-chat" type="button">＋ 新对话</button>
    <div id="conversations" class="conversations"></div>
    <a href="/admin" class="admin-link">管理后台 →</a>
  </aside>
  <main class="chat-card">
    <header class="chat-header">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></span>
      <div class="header-text">
        <h1>在线客服</h1>
        <p class="status"><span class="dot"></span>在线</p>
      </div>
    </header>
    <div id="messages" class="messages">
      <div class="bubble assistant">
        <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></span>
        <div class="content">您好，我是智能客服，请问有什么可以帮您？</div>
      </div>
    </div>

    <div id="quick-asks" class="quick-asks">
      <button class="quick-chip" type="button">查物流</button>
      <button class="quick-chip" type="button">查订单</button>
      <button class="quick-chip" type="button">我要退款</button>
      <button class="quick-chip" type="button">运费怎么算</button>
    </div>

    <footer class="input-area">
      <textarea id="input" rows="1" placeholder="请输入您的问题…"></textarea>
      <button id="send" aria-label="发送">➤</button>
    </footer>
  </main>

  <div id="cite-modal" class="cite-modal" hidden>
    <div class="cite-card" role="dialog" aria-modal="true" aria-labelledby="cite-path">
      <div class="cite-head">
        <span class="cite-label">来源</span>
        <button id="cite-close" class="cite-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="cite-path" class="cite-path"></div>
      <div id="cite-body" class="cite-body"></div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
