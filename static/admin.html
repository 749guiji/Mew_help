<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kb.css">
</head>
<body class="kb-body" data-page="admin">
  <main class="kb-card">
    <header class="chat-header">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></span>
      <div class="header-text">
        <h1>后台管理</h1>
        <p class="status">系统概览与快捷操作</p>
      </div>
    </header>
    <div id="cards" class="admin-cards">加载中…</div>
    <section class="kb-section" style="padding:14px 18px">
      <h2>快捷操作</h2>
      <div class="quick-asks" style="padding:0">
        <button id="run-flywheel" class="quick-chip" type="button">🔄 跑飞轮</button>
        <button id="run-eval" class="quick-chip" type="button">📊 跑评估</button>
        <button id="run-classify" class="quick-chip" type="button">🏷 跑主题归类</button>
      </div>
    </section>
  </main>
  <script src="/admin-shell.js" defer></script>
  <script src="/admin.js" defer></script>
</body>
</html>
