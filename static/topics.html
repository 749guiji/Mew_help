<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主题分布</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kb.css">
</head>
<body class="kb-body" data-page="topics">
  <main class="kb-card">
    <header class="chat-header">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 3-5"/></svg></span>
      <div class="header-text">
        <h1>主题分布</h1>
        <p class="status">哪类问题堆得多,一眼看出该先补哪块知识</p>
      </div>
    </header>
    <div class="kb-main">
      <section class="kb-section">
        <h2>各类目问题量</h2>
        <div id="dist"></div>
      </section>
      <section class="kb-section">
        <h2>类目问题列表</h2>
        <div id="qlist">点上面的类目查看问题。</div>
      </section>
    </div>
  </main>
  <script src="/admin-shell.js" defer></script>
  <script src="/topics.js" defer></script>
</body>
</html>
